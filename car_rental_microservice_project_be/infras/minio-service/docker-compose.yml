name: car-rental-minio

services:
  minio-api:
    image: car-rental-minio-api:local
    build:
      context: ../..
      dockerfile: infras/minio-service/Dockerfile
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${MINIO_HTTP_PORT:-8087}:8087"
    environment:
      FILE_SERVICE_BIND_ADDRESS: 0.0.0.0
      FILE_SERVICE_PORT: 8087
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      FILE_SERVICE_VEHICLE_API_KEY: ${FILE_SERVICE_VEHICLE_API_KEY:-local-vehicle-file-service-key}
      FILE_SERVICE_CUSTOMER_API_KEY: ${FILE_SERVICE_CUSTOMER_API_KEY:-local-customer-file-service-key}
      VEHICLE_IMAGE_BUCKET: ${VEHICLE_IMAGE_BUCKET:-vehicle-images}
      VEHICLE_DOCUMENT_BUCKET: ${VEHICLE_DOCUMENT_BUCKET:-vehicle-documents}
      CUSTOMER_IMAGE_BUCKET: ${CUSTOMER_IMAGE_BUCKET:-customer-images}
      FILE_SERVICE_PUBLIC_BUCKETS: ${MINIO_PUBLIC_BUCKETS-vehicle-images}
      FILE_SERVICE_MAX_FILE_SIZE: ${FILE_SERVICE_MAX_FILE_SIZE:-10MB}
      FILE_SERVICE_MAX_PRESIGN_EXPIRY: ${FILE_SERVICE_MAX_PRESIGN_EXPIRY:-10m}
      EUREKA_CLIENT_ENABLED: ${MINIO_EUREKA_ENABLED:-false}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://host.docker.internal:8761/eureka/}
    networks:
      - storage
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8087/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  minio:
    # Source-built MinIO distribution; pinned because the original upstream images were removed.
    image: ${MINIO_IMAGE:-ghcr.io/coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9}
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio-data:/data
    networks:
      - storage
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio-init:
    image: ${MINIO_IMAGE:-ghcr.io/coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_PUBLIC_BUCKETS: ${MINIO_PUBLIC_BUCKETS-vehicle-images}
      MINIO_PRIVATE_BUCKETS: ${MINIO_PRIVATE_BUCKETS-vehicle-documents}
    volumes:
      - ./init-buckets.sh:/init-buckets.sh:ro
    networks:
      - storage
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    restart: "no"

volumes:
  minio-data:
    external: true
    name: ${MINIO_DATA_VOLUME:-car-rental-minio-data}

networks:
  storage:
    external: true
    name: ${MINIO_NETWORK:-car-rental-storage}
