service:
  name: payment-service
  description: Payment Service
  version: 1.0.0
  port: 8084

spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DB_USER:root}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:1234}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/car-rental-realm}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:${EUREKA_URI:http://localhost:8761/eureka/}}
  instance:
    prefer-ip-address: true

server:
  port: ${SERVER_PORT:${service.port}}

payment:
  gateway:
    mock:
      enabled: true
      return-base-url: http://localhost:5173/payment/callback
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:DEMOVNPAY}
      hash-secret: ${VNPAY_HASH_SECRET:DEMOHASHSECRET1234567890}
      pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      return-url: http://localhost:5173/payment/callback
    payos:
      client-id: ${PAYOS_CLIENT_ID:your-payos-client-id}
      api-key: ${PAYOS_API_KEY:your-payos-api-key}
      checksum-key: ${PAYOS_CHECKSUM_KEY:your-payos-checksum-key}
      return-url: http://localhost:5173/payment/callback
      cancel-url: http://localhost:5173/payment/cancel
    vietqr:
      bank-id: ${VIETQR_BANK_ID:ICB}
      bank-name-display: ${VIETQR_BANK_NAME:VietinBank}
      account-no: ${VIETQR_ACCOUNT_NO:0376359204}
      account-name: ${VIETQR_ACCOUNT_NAME:HOANG TU UYEN}
    sepay:
      api-key: ${SEPAY_API_KEY:sepay_uyenht_2026}
      api-token: ${SEPAY_API_TOKEN:ZXTBRBXBX4WW09EMUOZPUSJJ26VYLLNMVOQ3D1LWJQYSCYE6TRWK7I3GTO2ITPNG}
